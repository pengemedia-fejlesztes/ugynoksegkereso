<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="100" fill="#0d0d0d"/>

  <!-- Grid pattern clipped to circle -->
  <clipPath id="circleClip">
    <circle cx="100" cy="100" r="98"/>
  </clipPath>
  <g clip-path="url(#circleClip)" stroke="#ccff00" stroke-width="0.5" opacity="0.18">
    <line x1="25"  y1="0" x2="25"  y2="200"/>
    <line x1="50"  y1="0" x2="50"  y2="200"/>
    <line x1="75"  y1="0" x2="75"  y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="125" y1="0" x2="125" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="175" y1="0" x2="175" y2="200"/>
    <line x1="0" y1="25"  x2="200" y2="25"/>
    <line x1="0" y1="50"  x2="200" y2="50"/>
    <line x1="0" y1="75"  x2="200" y2="75"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="125" x2="200" y2="125"/>
    <line x1="0" y1="150" x2="200" y2="150"/>
    <line x1="0" y1="175" x2="200" y2="175"/>
  </g>

  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#ccff00" stroke-width="2"/>

  <!-- Eye shape (lid) -->
  <path d="M28 100 Q100 46 172 100 Q100 154 28 100Z" fill="none" stroke="#ccff00" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Iris -->
  <circle cx="100" cy="100" r="36" fill="none" stroke="#ccff00" stroke-width="2.2"/>

  <!-- Pupil fill -->
  <circle cx="100" cy="100" r="18" fill="#ccff00"/>

  <!-- Inner dark pupil -->
  <circle cx="100" cy="100" r="7" fill="#0d0d0d"/>

  <!-- Reflection dot -->
  <circle cx="109" cy="91" r="4" fill="#ccff00" opacity="0.7"/>

  <!-- Eyelashes top -->
  <line x1="100" y1="62"  x2="100" y2="50"  stroke="#ccff00" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78"  y1="70"  x2="71"  y2="59"  stroke="#ccff00" stroke-width="2"   stroke-linecap="round"/>
  <line x1="122" y1="70"  x2="129" y2="59"  stroke="#ccff00" stroke-width="2"   stroke-linecap="round"/>
  <line x1="88"  y1="65"  x2="84"  y2="53"  stroke="#ccff00" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="112" y1="65"  x2="116" y2="53"  stroke="#ccff00" stroke-width="1.8" stroke-linecap="round"/>

</svg>
