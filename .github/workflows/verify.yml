name: Jelölt cégek ellenőrzése

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/candidates.json'
      - 'scripts/verify-sites.mjs'

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-sites.mjs
      - name: Commit
        run: |
          git add data/verify
          if git diff --cached --quiet; then echo "Nincs változás"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "Jelölt cégek weboldalai (automatikus ellenőrzés)"
          git pull --rebase
          git push
